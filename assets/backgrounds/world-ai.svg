<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="AI and LLM Orchestration vector illustration">
  <defs>
    <linearGradient id="b-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A0E0E"/>
      <stop offset="0.55" stop-color="#1A0808"/>
      <stop offset="1" stop-color="#0A0303"/>
    </linearGradient>
    <radialGradient id="b-sun" cx="0.52" cy="0.6" r="0.55">
      <stop offset="0" stop-color="#E8C77D" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#B84A2A" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0A0303" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="b-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8C77D"/><stop offset="1" stop-color="#B88A2F"/>
    </linearGradient>
    <pattern id="b-grain" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <circle cx="0.6" cy="0.6" r="0.45" fill="#F5F2EC" opacity="0.05"/>
      <circle cx="2.1" cy="1.8" r="0.35" fill="#000" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="600" height="800" fill="url(#b-sky)"/>
  <rect width="600" height="800" fill="url(#b-sun)"/>

  <!-- AI / Brain Central Hub Concept -->
  <!-- Outer glowing rings -->
  <circle cx="300" cy="400" r="160" fill="none" stroke="#F0D08A" stroke-width="1.5" stroke-dasharray="10,6" opacity="0.16"/>
  <circle cx="300" cy="400" r="220" fill="none" stroke="#F0D08A" stroke-width="1" stroke-dasharray="4,8" opacity="0.08"/>

  <!-- Terminal window shell -->
  <g fill="#0A0303" stroke="#160606" stroke-width="4">
    <rect x="110" y="210" width="380" height="420" rx="14"/>
  </g>
  <rect x="126" y="250" width="348" height="364" fill="#060202" stroke="#250B0B" stroke-width="2"/>

  <!-- Command Line header -->
  <line x1="126" y1="280" x2="474" y2="280" stroke="#250B0B" stroke-width="1.5"/>
  <text x="142" y="270" font-family="monospace" font-size="12" fill="#B84A2A" opacity="0.8">SYSTEM_AGENT_ORCHESTRATOR</text>
  <circle cx="456" cy="266" r="4" fill="#B84A2A"/>

  <!-- Prompt terminal lines -->
  <g fill="none" stroke="url(#b-gold)" stroke-width="1.5" opacity="0.85">
    <!-- prompt arrow -->
    <path d="M 146,310 L 154,316 L 146,322" stroke-width="2"/>
    <line x1="168" y1="316" x2="320" y2="316" stroke-width="2"/>
    
    <!-- thinking node visual -->
    <circle cx="300" cy="420" r="32" fill="#1A0808" stroke-width="2"/>
    <circle cx="300" cy="420" r="20" fill="none" stroke-width="1.5" stroke-dasharray="6,4"/>
    <circle cx="300" cy="420" r="4" fill="url(#b-gold)" stroke="none"/>

    <!-- connections out to parameters/tokens -->
    <g stroke-dasharray="2,2" opacity="0.6">
      <line x1="300" y1="388" x2="300" y2="330"/>
      <line x1="300" y1="452" x2="300" y2="510"/>
      <line x1="268" y1="420" x2="200" y2="420"/>
      <line x1="332" y1="420" x2="400" y2="420"/>
      <line x1="277" y1="397" x2="220" y2="350"/>
      <line x1="323" y1="397" x2="380" y2="350"/>
      <line x1="277" y1="443" x2="220" y2="490"/>
      <line x1="323" y1="443" x2="380" y2="490"/>
    </g>

    <!-- Peripheral Token nodes -->
    <circle cx="300" cy="330" r="6" fill="#0A0303" stroke-width="1.5"/>
    <circle cx="300" cy="510" r="6" fill="#0A0303" stroke-width="1.5"/>
    <circle cx="200" cy="420" r="6" fill="#0A0303" stroke-width="1.5"/>
    <circle cx="400" cy="420" r="6" fill="#0A0303" stroke-width="1.5"/>
    <circle cx="220" cy="350" r="6" fill="#0A0303" stroke-width="1.5"/>
    <circle cx="380" cy="350" r="6" fill="#0A0303" stroke-width="1.5"/>
    <circle cx="220" cy="490" r="6" fill="#0A0303" stroke-width="1.5"/>
    <circle cx="380" cy="490" r="6" fill="#0A0303" stroke-width="1.5"/>

    <!-- Glowing Parameter Activations -->
    <circle cx="300" cy="330" r="3" fill="url(#b-gold)" stroke="none"/>
    <circle cx="200" cy="420" r="3" fill="url(#b-gold)" stroke="none"/>
    <circle cx="380" cy="350" r="3" fill="url(#b-gold)" stroke="none"/>
    <circle cx="220" cy="490" r="3" fill="url(#b-gold)" stroke="none"/>

    <!-- Agent outputs/code lines below -->
    <g opacity="0.7">
      <rect x="146" y="550" width="180" height="8" rx="2" fill="url(#b-gold)" stroke="none"/>
      <rect x="146" y="568" width="240" height="8" rx="2" fill="url(#b-gold)" stroke="none"/>
      <rect x="146" y="586" width="120" height="8" rx="2" fill="url(#b-gold)" stroke="none"/>
    </g>
  </g>

  <!-- Foreground reflections -->
  <rect x="0" y="700" width="600" height="100" fill="#050101"/>
  <line x1="0" y1="700" x2="600" y2="700" stroke="#160606" stroke-width="2"/>

  <!-- Subtle grid reflection -->
  <g stroke="url(#b-gold)" stroke-width="1" opacity="0.08" fill="none">
    <line x1="160" y1="700" x2="160" y2="800"/>
    <line x1="300" y1="700" x2="300" y2="800"/>
    <line x1="440" y1="700" x2="440" y2="800"/>
  </g>

  <rect width="600" height="800" fill="url(#b-grain)"/>
</svg>
