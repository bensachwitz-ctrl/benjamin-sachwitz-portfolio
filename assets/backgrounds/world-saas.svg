<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="SaaS and Chapter Operations vector illustration">
  <defs>
    <linearGradient id="b-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A0E0E"/>
      <stop offset="0.55" stop-color="#1A0808"/>
      <stop offset="1" stop-color="#0A0303"/>
    </linearGradient>
    <radialGradient id="b-sun" cx="0.52" cy="0.6" r="0.55">
      <stop offset="0" stop-color="#E8C77D" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#B84A2A" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0A0303" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="b-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8C77D"/><stop offset="1" stop-color="#B88A2F"/>
    </linearGradient>
    <pattern id="b-grain" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <circle cx="0.6" cy="0.6" r="0.45" fill="#F5F2EC" opacity="0.05"/>
      <circle cx="2.1" cy="1.8" r="0.35" fill="#000" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="600" height="800" fill="url(#b-sky)"/>
  <rect width="600" height="800" fill="url(#b-sun)"/>

  <!-- Halo circles -->
  <circle cx="300" cy="420" r="190" fill="none" stroke="#F0D08A" stroke-width="1" opacity="0.1"/>

  <!-- Dashboard layout wrapper -->
  <g fill="#0A0303" stroke="#160606" stroke-width="4">
    <rect x="90" y="190" width="420" height="460" rx="20"/>
  </g>
  <rect x="106" y="230" width="388" height="404" fill="#060202" stroke="#250B0B" stroke-width="2"/>

  <!-- Dashboard Sidebar -->
  <rect x="106" y="230" width="80" height="404" fill="#0D0404" stroke="#250B0B" stroke-width="1.5"/>
  <g fill="#B84A2A" opacity="0.5">
    <rect x="116" y="250" width="60" height="8" rx="2"/>
    <rect x="116" y="275" width="60" height="8" rx="2"/>
    <rect x="116" y="300" width="60" height="8" rx="2"/>
    <rect x="116" y="325" width="60" height="8" rx="2"/>
  </g>

  <!-- Main Dashboard Content -->
  <!-- Stats row -->
  <g stroke="url(#b-gold)" stroke-width="1.5" fill="none" opacity="0.75">
    <!-- Stat card 1 -->
    <rect x="202" y="246" width="134" height="60" rx="8" fill="#1A0808" fill-opacity="0.3"/>
    <line x1="214" y1="264" x2="274" y2="264" stroke-width="2"/>
    <circle cx="218" cy="286" r="6" fill="url(#b-gold)" stroke="none"/>
    <line x1="234" y1="286" x2="294" y2="286" stroke-width="3"/>

    <!-- Stat card 2 -->
    <rect x="348" y="246" width="134" height="60" rx="8" fill="#1A0808" fill-opacity="0.3"/>
    <line x1="360" y1="264" x2="420" y2="264" stroke-width="2"/>
    <path d="M 360,290 L 380,280 L 400,288 L 420,278" stroke-width="2.5"/>
  </g>

  <!-- Large Data Viz Chart (Greek Stack operations dashboard theme) -->
  <g stroke="url(#b-gold)" stroke-width="1.5" fill="none" opacity="0.8">
    <rect x="202" y="326" width="280" height="150" rx="10" fill="#0D0404" stroke-width="1.5"/>
    
    <!-- Y and X axis -->
    <line x1="222" y1="346" x2="222" y2="446"/>
    <line x1="222" y1="446" x2="462" y2="446"/>
    
    <!-- Chart lines (dues collected metrics) -->
    <path d="M 222,430 Q 262,390 302,410 T 382,356 T 462,342" stroke-width="3" stroke="url(#b-gold)"/>
    <path d="M 222,430 Q 262,390 302,410 T 382,356 T 462,342 L 462,446 L 222,446 Z" fill="url(#b-gold)" fill-opacity="0.08" stroke="none"/>
  </g>

  <!-- Roster/Chapter workflow list -->
  <g stroke="url(#b-gold)" stroke-width="1.2" fill="none" opacity="0.65">
    <!-- Row 1 -->
    <rect x="202" y="496" width="280" height="32" rx="6" fill="#1A0808" fill-opacity="0.2"/>
    <circle cx="220" cy="512" r="6" fill="#B84A2A" fill-opacity="0.5" stroke="none"/>
    <line x1="236" y1="512" x2="356" y2="512" stroke-width="2"/>
    <path d="M 450,512 l4 4 l8 -8" stroke-width="2"/>

    <!-- Row 2 -->
    <rect x="202" y="538" width="280" height="32" rx="6" fill="#1A0808" fill-opacity="0.2"/>
    <circle cx="220" cy="554" r="6" fill="#B84A2A" fill-opacity="0.5" stroke="none"/>
    <line x1="236" y1="554" x2="330" y2="554" stroke-width="2"/>
    <path d="M 450,554 l4 4 l8 -8" stroke-width="2"/>

    <!-- Row 3 -->
    <rect x="202" y="580" width="280" height="32" rx="6" fill="#1A0808" fill-opacity="0.2"/>
    <circle cx="220" cy="596" r="6" fill="#B84A2A" fill-opacity="0.5" stroke="none"/>
    <line x1="236" y1="596" x2="380" y2="596" stroke-width="2"/>
    <path d="M 450,596 l4 4 l8 -8" stroke-width="2"/>
  </g>

  <!-- Foreground reflections -->
  <rect x="0" y="700" width="600" height="100" fill="#050101"/>
  <line x1="0" y1="700" x2="600" y2="700" stroke="#160606" stroke-width="2"/>

  <!-- Subtle grid reflection -->
  <g stroke="url(#b-gold)" stroke-width="1" opacity="0.08" fill="none">
    <line x1="160" y1="700" x2="160" y2="800"/>
    <line x1="300" y1="700" x2="300" y2="800"/>
    <line x1="440" y1="700" x2="440" y2="800"/>
  </g>

  <rect width="600" height="800" fill="url(#b-grain)"/>
</svg>
