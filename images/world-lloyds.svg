<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="The Lloyd's of London building, modern editorial illustration">
  <defs>
    <linearGradient id="ll-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1228"/>
      <stop offset="0.5" stop-color="#14101e"/>
      <stop offset="1" stop-color="#0a0812"/>
    </linearGradient>
    <linearGradient id="ll-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8C77D"/>
      <stop offset="1" stop-color="#B88A2F"/>
    </linearGradient>
    <linearGradient id="ll-building" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a1a2a"/>
      <stop offset="1" stop-color="#1a0e1a"/>
    </linearGradient>
    <radialGradient id="ll-glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#E8C77D" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0a0812" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="800" fill="url(#ll-bg)"/>
  <rect width="600" height="800" fill="url(#ll-glow)"/>

  <!-- Stylized Lloyd's building (the famous inside-out building) -->
  <g transform="translate(120, 180)">
    <!-- Main tower mass -->
    <rect x="0" y="0" width="200" height="420" fill="url(#ll-building)" rx="4"/>

    <!-- Exterior service towers (the iconic dark columns on the outside) -->
    <rect x="-18" y="20" width="22" height="400" fill="#0d0810" rx="3"/>
    <rect x="196" y="40" width="22" height="380" fill="#0d0810" rx="3"/>

    <!-- Glass curtain facade with horizontal floor lines -->
    <g stroke="#3a2a3a" stroke-width="1" opacity="0.6">
      <line x1="0" y1="40" x2="200" y2="40"/>
      <line x1="0" y1="80" x2="200" y2="80"/>
      <line x1="0" y1="120" x2="200" y2="120"/>
      <line x1="0" y1="160" x2="200" y2="160"/>
      <line x1="0" y1="200" x2="200" y2="200"/>
      <line x1="0" y1="240" x2="200" y2="240"/>
      <line x1="0" y1="280" x2="200" y2="280"/>
      <line x1="0" y1="320" x2="200" y2="320"/>
      <line x1="0" y1="360" x2="200" y2="360"/>
    </g>

    <!-- Lit windows, warm gold, sparse and elegant -->
    <g fill="url(#ll-gold)" opacity="0.7">
      <rect x="20" y="50" width="8" height="22" rx="1"/>
      <rect x="50" y="90" width="8" height="22" rx="1"/>
      <rect x="90" y="50" width="8" height="22" rx="1"/>
      <rect x="130" y="130" width="8" height="22" rx="1"/>
      <rect x="170" y="90" width="8" height="22" rx="1"/>
      <rect x="60" y="170" width="8" height="22" rx="1"/>
      <rect x="110" y="210" width="8" height="22" rx="1"/>
      <rect x="160" y="250" width="8" height="22" rx="1"/>
      <rect x="30" y="290" width="8" height="22" rx="1"/>
      <rect x="100" y="330" width="8" height="22" rx="1"/>
      <rect x="150" y="370" width="8" height="22" rx="1"/>
    </g>

    <!-- Top crane/antenna detail -->
    <rect x="95" y="-20" width="10" height="20" fill="#0d0810"/>
    <rect x="85" y="-26" width="30" height="6" fill="#0d0810"/>
  </g>

  <!-- Surrounding city buildings, simplified silhouettes -->
  <g fill="#0d0810" opacity="0.7">
    <rect x="40" y="320" width="60" height="280" rx="2"/>
    <rect x="340" y="280" width="70" height="320" rx="2"/>
    <rect x="430" y="350" width="50" height="250" rx="2"/>
    <rect x="500" y="300" width="60" height="300" rx="2"/>
  </g>

  <!-- A few lit windows on surrounding buildings -->
  <g fill="url(#ll-gold)" opacity="0.4">
    <rect x="52" y="360" width="5" height="8"/>
    <rect x="68" y="400" width="5" height="8"/>
    <rect x="52" y="440" width="5" height="8"/>
    <rect x="352" y="320" width="5" height="8"/>
    <rect x="372" y="360" width="5" height="8"/>
    <rect x="392" y="400" width="5" height="8"/>
    <rect x="510" y="340" width="5" height="8"/>
    <rect x="530" y="380" width="5" height="8"/>
    <rect x="550" y="420" width="5" height="8"/>
  </g>

  <!-- Ground plane -->
  <rect x="0" y="600" width="600" height="200" fill="#080610"/>
  <rect x="0" y="600" width="600" height="2" fill="#1a1228" opacity="0.8"/>

  <!-- Subtle street light reflections -->
  <g fill="url(#ll-gold)" opacity="0.08">
    <ellipse cx="150" cy="680" rx="80" ry="20"/>
    <ellipse cx="450" cy="700" rx="100" ry="24"/>
  </g>

  <!-- Floating "Lloyd's" marker, very subtle -->
  <text x="300" y="750" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#E8C77D" opacity="0.3" letter-spacing="4">Lloyd's of London</text>
</svg>
