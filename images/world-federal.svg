<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="The US Capitol building at dusk, editorial illustration">
  <defs>
    <linearGradient id="dc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a28"/>
      <stop offset="0.5" stop-color="#141420"/>
      <stop offset="1" stop-color="#0a0a12"/>
    </linearGradient>
    <linearGradient id="dc-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8C77D"/>
      <stop offset="1" stop-color="#B88A2F"/>
    </linearGradient>
    <linearGradient id="dc-building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a24"/>
      <stop offset="1" stop-color="#0d0d14"/>
    </linearGradient>
    <radialGradient id="dc-glow" cx="0.5" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#E8C77D" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0a0a12" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="800" fill="url(#dc-bg)"/>
  <rect width="600" height="800" fill="url(#dc-glow)"/>

  <!-- The Capitol building, centered -->
  <g transform="translate(150, 280)">
    <!-- Left wing -->
    <rect x="0" y="120" width="100" height="220" fill="url(#dc-building)" rx="2"/>
    <!-- Right wing -->
    <rect x="200" y="120" width="100" height="220" fill="url(#dc-building)" rx="2"/>

    <!-- Central section -->
    <rect x="100" y="80" width="100" height="260" fill="url(#dc-building)" rx="2"/>

    <!-- Columns on central section -->
    <g fill="#0a0a10" opacity="0.6">
      <rect x="108" y="100" width="6" height="240"/>
      <rect x="124" y="100" width="6" height="240"/>
      <rect x="140" y="100" width="6" height="240"/>
      <rect x="156" y="100" width="6" height="240"/>
      <rect x="172" y="100" width="6" height="240"/>
      <rect x="188" y="100" width="6" height="240"/>
    </g>

    <!-- Dome base -->
    <rect x="120" y="60" width="60" height="30" fill="url(#dc-building)" rx="2"/>

    <!-- Dome -->
    <path d="M125 60 Q150 0 175 60 Z" fill="url(#dc-building)"/>

    <!-- Dome detail lines -->
    <g stroke="#2a2a3a" stroke-width="0.8" opacity="0.5" fill="none">
      <path d="M132 60 Q150 12 168 60"/>
      <path d="M138 60 Q150 24 162 60"/>
    </g>

    <!-- Statue on top -->
    <rect x="148" y="-12" width="4" height="14" fill="#0a0a10"/>
    <circle cx="150" cy="-14" r="3" fill="#0a0a10"/>

    <!-- Pediment triangle -->
    <path d="M100 80 L150 60 L200 80 Z" fill="url(#dc-building)"/>

    <!-- Steps -->
    <g fill="#0a0a10">
      <rect x="-10" y="340" width="320" height="6" rx="1"/>
      <rect x="-20" y="346" width="340" height="6" rx="1"/>
      <rect x="-30" y="352" width="360" height="6" rx="1"/>
    </g>

    <!-- Lit windows -->
    <g fill="url(#dc-gold)" opacity="0.5">
      <rect x="20" y="160" width="8" height="20" rx="1"/>
      <rect x="50" y="160" width="8" height="20" rx="1"/>
      <rect x="70" y="200" width="8" height="20" rx="1"/>
      <rect x="220" y="160" width="8" height="20" rx="1"/>
      <rect x="250" y="160" width="8" height="20" rx="1"/>
      <rect x="270" y="200" width="8" height="20" rx="1"/>
      <rect x="130" y="140" width="6" height="16" rx="1"/>
      <rect x="160" y="140" width="6" height="16" rx="1"/>
    </g>
  </g>

  <!-- Surrounding buildings -->
  <g fill="#0a0a14" opacity="0.6">
    <rect x="20" y="380" width="80" height="220" rx="2"/>
    <rect x="500" y="360" width="80" height="240" rx="2"/>
  </g>

  <!-- Lit windows on surrounding buildings -->
  <g fill="url(#dc-gold)" opacity="0.3">
    <rect x="32" y="420" width="5" height="8"/>
    <rect x="52" y="460" width="5" height="8"/>
    <rect x="72" y="500" width="5" height="8"/>
    <rect x="512" y="400" width="5" height="8"/>
    <rect x="532" y="440" width="5" height="8"/>
    <rect x="552" y="480" width="5" height="8"/>
    <rect x="572" y="520" width="5" height="8"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="600" width="600" height="200" fill="#080810"/>

  <!-- Subtle reflection on the mall -->
  <g fill="url(#dc-gold)" opacity="0.06">
    <ellipse cx="300" cy="680" rx="180" ry="30"/>
  </g>

  <!-- Floating marker -->
  <text x="300" y="750" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#E8C77D" opacity="0.3" letter-spacing="4">Federal DC</text>
</svg>
