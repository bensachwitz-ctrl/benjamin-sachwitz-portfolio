<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="A Southern pine forest seen from above, oxblood duotone illustration">
  <defs>
    <linearGradient id="fr-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A0E0E"/>
      <stop offset="0.5" stop-color="#1A0808"/>
      <stop offset="1" stop-color="#0A0303"/>
    </linearGradient>
    <radialGradient id="fr-light" cx="0.34" cy="0.26" r="0.7">
      <stop offset="0" stop-color="#D4A843" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#8B1A1A" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0A0303" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fr-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8C77D"/><stop offset="1" stop-color="#B88A2F"/>
    </linearGradient>
    <pattern id="fr-grain" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <circle cx="0.6" cy="0.6" r="0.45" fill="#F5F2EC" opacity="0.05"/>
      <circle cx="2.1" cy="1.8" r="0.35" fill="#000" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="600" height="800" fill="url(#fr-bg)"/>
  <rect width="600" height="800" fill="url(#fr-light)"/>

  <!-- A logging cut-line / forest road carving a diagonal through the canopy -->
  <polygon points="0,520 600,300 600,360 0,580" fill="#0A0303" opacity="0.85"/>
  <line x1="0" y1="550" x2="600" y2="330" stroke="#6B1111" stroke-width="1.4" opacity="0.5"/>

  <!-- Pine crowns from above: concentric radial needle stars at a planted-grid cadence.
       Drawn as a reusable symbol, scattered in rows like a managed timber stand. -->
  <g stroke="#8B1A1A" stroke-width="1.3" fill="none" opacity="0.9">
    <!-- top band -->
    <g transform="translate(70 90)">
      <circle r="22" fill="#160606"/><g stroke="#D4A843" opacity="0.6"><line x1="0" y1="-22" x2="0" y2="22"/><line x1="-22" y1="0" x2="22" y2="0"/><line x1="-15" y1="-15" x2="15" y2="15"/><line x1="-15" y1="15" x2="15" y2="-15"/></g>
    </g>
    <g transform="translate(190 70)"><circle r="26" fill="#1C0808"/><g stroke="#D4A843" opacity="0.55"><line x1="0" y1="-26" x2="0" y2="26"/><line x1="-26" y1="0" x2="26" y2="0"/><line x1="-18" y1="-18" x2="18" y2="18"/><line x1="-18" y1="18" x2="18" y2="-18"/></g></g>
    <g transform="translate(320 96)"><circle r="20" fill="#160606"/><g stroke="#D4A843" opacity="0.6"><line x1="0" y1="-20" x2="0" y2="20"/><line x1="-20" y1="0" x2="20" y2="0"/><line x1="-14" y1="-14" x2="14" y2="14"/><line x1="-14" y1="14" x2="14" y2="-14"/></g></g>
    <g transform="translate(440 64)"><circle r="28" fill="#1C0808"/><g stroke="#D4A843" opacity="0.5"><line x1="0" y1="-28" x2="0" y2="28"/><line x1="-28" y1="0" x2="28" y2="0"/><line x1="-20" y1="-20" x2="20" y2="20"/><line x1="-20" y1="20" x2="20" y2="-20"/></g></g>
    <g transform="translate(548 92)"><circle r="22" fill="#160606"/><g stroke="#D4A843" opacity="0.55"><line x1="0" y1="-22" x2="0" y2="22"/><line x1="-22" y1="0" x2="22" y2="0"/><line x1="-15" y1="-15" x2="15" y2="15"/><line x1="-15" y1="15" x2="15" y2="-15"/></g></g>
    <!-- second band -->
    <g transform="translate(120 190)"><circle r="24" fill="#1C0808"/><g stroke="#D4A843" opacity="0.5"><line x1="0" y1="-24" x2="0" y2="24"/><line x1="-24" y1="0" x2="24" y2="0"/><line x1="-17" y1="-17" x2="17" y2="17"/><line x1="-17" y1="17" x2="17" y2="-17"/></g></g>
    <g transform="translate(255 210)"><circle r="20" fill="#160606"/><g stroke="#D4A843" opacity="0.55"><line x1="0" y1="-20" x2="0" y2="20"/><line x1="-20" y1="0" x2="20" y2="0"/></g></g>
    <g transform="translate(388 196)"><circle r="26" fill="#1C0808"/><g stroke="#D4A843" opacity="0.5"><line x1="0" y1="-26" x2="0" y2="26"/><line x1="-26" y1="0" x2="26" y2="0"/><line x1="-18" y1="-18" x2="18" y2="18"/><line x1="-18" y1="18" x2="18" y2="-18"/></g></g>
    <g transform="translate(516 214)"><circle r="22" fill="#160606"/><g stroke="#D4A843" opacity="0.55"><line x1="0" y1="-22" x2="0" y2="22"/><line x1="-22" y1="0" x2="22" y2="0"/></g></g>
    <!-- lower bands, darker / smaller (depth) -->
    <g opacity="0.75">
      <g transform="translate(80 620)"><circle r="18" fill="#120505"/><g stroke="#8B1A1A"><line x1="0" y1="-18" x2="0" y2="18"/><line x1="-18" y1="0" x2="18" y2="0"/></g></g>
      <g transform="translate(210 660)"><circle r="22" fill="#120505"/><g stroke="#8B1A1A"><line x1="0" y1="-22" x2="0" y2="22"/><line x1="-22" y1="0" x2="22" y2="0"/><line x1="-15" y1="-15" x2="15" y2="15"/><line x1="-15" y1="15" x2="15" y2="-15"/></g></g>
      <g transform="translate(350 632)"><circle r="19" fill="#120505"/><g stroke="#8B1A1A"><line x1="0" y1="-19" x2="0" y2="19"/><line x1="-19" y1="0" x2="19" y2="0"/></g></g>
      <g transform="translate(480 668)"><circle r="24" fill="#120505"/><g stroke="#8B1A1A"><line x1="0" y1="-24" x2="0" y2="24"/><line x1="-24" y1="0" x2="24" y2="0"/><line x1="-17" y1="-17" x2="17" y2="17"/><line x1="-17" y1="17" x2="17" y2="-17"/></g></g>
      <g transform="translate(560 628)"><circle r="18" fill="#120505"/><g stroke="#8B1A1A"><line x1="0" y1="-18" x2="0" y2="18"/><line x1="-18" y1="0" x2="18" y2="0"/></g></g>
      <g transform="translate(140 740)"><circle r="20" fill="#120505"/><g stroke="#8B1A1A"><line x1="0" y1="-20" x2="0" y2="20"/><line x1="-20" y1="0" x2="20" y2="0"/></g></g>
      <g transform="translate(300 760)"><circle r="22" fill="#120505"/><g stroke="#8B1A1A"><line x1="0" y1="-22" x2="0" y2="22"/><line x1="-22" y1="0" x2="22" y2="0"/></g></g>
      <g transform="translate(440 752)"><circle r="19" fill="#120505"/><g stroke="#8B1A1A"><line x1="0" y1="-19" x2="0" y2="19"/><line x1="-19" y1="0" x2="19" y2="0"/></g></g>
    </g>
  </g>

  <!-- a single gold survey stake on the cut-line -->
  <g transform="translate(300 540)">
    <line x1="0" y1="0" x2="0" y2="-26" stroke="url(#fr-gold)" stroke-width="2.2"/>
    <path d="M0 -26 l14 5 -14 5 Z" fill="url(#fr-gold)"/>
  </g>

  <rect width="600" height="800" fill="url(#fr-grain)"/>
  <rect width="600" height="800" fill="#0A0303" opacity="0.05"/>
</svg>
