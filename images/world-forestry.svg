<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="A Southern pine stand at dusk, oxblood duotone illustration">
  <defs>
    <linearGradient id="fr-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A0E0E"/>
      <stop offset="0.55" stop-color="#1A0808"/>
      <stop offset="1" stop-color="#0A0303"/>
    </linearGradient>
    <radialGradient id="fr-sun" cx="0.5" cy="0.72" r="0.55">
      <stop offset="0" stop-color="#E8C77D" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#B84A2A" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0A0303" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fr-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8C77D"/><stop offset="1" stop-color="#B88A2F"/>
    </linearGradient>
    <pattern id="fr-grain" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <circle cx="0.6" cy="0.6" r="0.45" fill="#F5F2EC" opacity="0.05"/>
      <circle cx="2.1" cy="1.8" r="0.35" fill="#000" opacity="0.06"/>
    </pattern>
    <!-- One reusable layered-pine silhouette (tip at 0,0; base near 0,120) -->
    <g id="fr-pine">
      <path d="M0 0 L20 40 L10 40 L26 74 L14 74 L34 116 L-34 116 L-14 74 L-26 74 L-10 40 L-20 40 Z"/>
      <rect x="-4" y="116" width="8" height="16"/>
    </g>
  </defs>

  <rect width="600" height="800" fill="url(#fr-bg)"/>
  <!-- low sun glow on the horizon -->
  <rect width="600" height="800" fill="url(#fr-sun)"/>
  <circle cx="300" cy="576" r="46" fill="#F0D08A" opacity="0.32"/>

  <!-- distant ridge line -->
  <path d="M0 560 Q150 540 300 552 T600 548 L600 560 L0 560 Z" fill="#160606" opacity="0.7"/>

  <!-- BACK stand — small, faint pines along the ridge (depth) -->
  <g fill="#160606" opacity="0.7">
    <use href="#fr-pine" transform="translate(60 470) scale(0.55)"/>
    <use href="#fr-pine" transform="translate(140 486) scale(0.48)"/>
    <use href="#fr-pine" transform="translate(225 462) scale(0.6)"/>
    <use href="#fr-pine" transform="translate(360 470) scale(0.5)"/>
    <use href="#fr-pine" transform="translate(445 458) scale(0.62)"/>
    <use href="#fr-pine" transform="translate(540 480) scale(0.5)"/>
  </g>

  <!-- MID stand — the planted-row cadence of a managed timber stand -->
  <g fill="#0F0404" opacity="0.92" stroke="#8B1A1A" stroke-width="0.8">
    <use href="#fr-pine" transform="translate(45 452) scale(0.85)"/>
    <use href="#fr-pine" transform="translate(160 470) scale(0.78)"/>
    <use href="#fr-pine" transform="translate(300 440) scale(0.95)"/>
    <use href="#fr-pine" transform="translate(440 468) scale(0.8)"/>
    <use href="#fr-pine" transform="translate(560 452) scale(0.86)"/>
  </g>

  <!-- FRONT stand — large, near-black foreground pines -->
  <g fill="#080202" stroke="#6B1111" stroke-width="1">
    <use href="#fr-pine" transform="translate(-10 520) scale(1.5)"/>
    <use href="#fr-pine" transform="translate(150 560) scale(1.25)"/>
    <use href="#fr-pine" transform="translate(330 540) scale(1.55)"/>
    <use href="#fr-pine" transform="translate(520 566) scale(1.3)"/>
    <use href="#fr-pine" transform="translate(620 528) scale(1.4)"/>
  </g>

  <!-- gold survey stake on the stand line -->
  <g transform="translate(258 612)">
    <line x1="0" y1="0" x2="0" y2="-30" stroke="url(#fr-gold)" stroke-width="2.4"/>
    <path d="M0 -30 l16 6 -16 6 Z" fill="url(#fr-gold)"/>
  </g>

  <rect width="600" height="800" fill="url(#fr-grain)"/>
</svg>
