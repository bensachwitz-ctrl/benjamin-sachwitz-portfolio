<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Commercial truck on a Southeast highway at dusk, editorial illustration">
  <defs>
    <linearGradient id="tr-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1428"/>
      <stop offset="0.4" stop-color="#241a18"/>
      <stop offset="1" stop-color="#0a0808"/>
    </linearGradient>
    <linearGradient id="tr-road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1414"/>
      <stop offset="1" stop-color="#0a0606"/>
    </linearGradient>
    <linearGradient id="tr-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8C77D"/>
      <stop offset="1" stop-color="#B88A2F"/>
    </linearGradient>
    <radialGradient id="tr-sun" cx="0.7" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#E8C77D" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="800" fill="url(#tr-bg)"/>
  <rect width="600" height="800" fill="url(#tr-sun)"/>

  <!-- Distant tree line -->
  <g fill="#0d0a0a" opacity="0.6">
    <path d="M0 520 L20 500 L40 510 L60 490 L80 505 L100 495 L120 510 L140 490 L160 500 L180 495 L200 510 L220 490 L240 505 L260 495 L280 510 L300 490 L320 505 L340 495 L360 510 L380 490 L400 505 L420 495 L440 510 L460 490 L480 505 L500 495 L520 510 L540 490 L560 505 L580 495 L600 510 L600 600 L0 600 Z"/>
  </g>

  <!-- Highway road perspective -->
  <polygon points="200,600 400,600 500,800 100,800" fill="url(#tr-road)"/>

  <!-- Road lane markings -->
  <g stroke="#E8C77D" stroke-width="3" opacity="0.4" stroke-dasharray="20 30">
    <line x1="300" y1="600" x2="300" y2="800"/>
  </g>

  <!-- The truck, side view, heading right -->
  <g transform="translate(150, 340)">
    <!-- Trailer -->
    <rect x="0" y="0" width="220" height="120" fill="#1a1414" rx="4"/>
    <rect x="0" y="0" width="220" height="120" fill="none" stroke="#2a1a1a" stroke-width="2" rx="4"/>

    <!-- Trailer panels -->
    <g stroke="#2a1a1a" stroke-width="1" opacity="0.5">
      <line x1="55" y1="0" x2="55" y2="120"/>
      <line x1="110" y1="0" x2="110" y2="120"/>
      <line x1="165" y1="0" x2="165" y2="120"/>
    </g>

    <!-- Cab -->
    <path d="M220 20 L280 20 L290 50 L290 120 L220 120 Z" fill="#0d0810" rx="4"/>

    <!-- Windshield -->
    <path d="M232 28 L272 28 L280 50 L232 50 Z" fill="url(#tr-gold)" opacity="0.3"/>

    <!-- Headlight -->
    <circle cx="285" cy="80" r="6" fill="url(#tr-gold)" opacity="0.8"/>

    <!-- Wheels -->
    <g fill="#050303">
      <circle cx="40" cy="130" r="18"/>
      <circle cx="100" cy="130" r="18"/>
      <circle cx="160" cy="130" r="18"/>
      <circle cx="255" cy="130" r="18"/>
    </g>
    <g fill="#1a1414">
      <circle cx="40" cy="130" r="8"/>
      <circle cx="100" cy="130" r="8"/>
      <circle cx="160" cy="130" r="8"/>
      <circle cx="255" cy="130" r="8"/>
    </g>

    <!-- Subtle gold pin-striping on trailer -->
    <line x1="10" y1="60" x2="210" y2="60" stroke="url(#tr-gold)" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="600" width="600" height="200" fill="#080606"/>

  <!-- Subtle headlight glow on road -->
  <g fill="url(#tr-gold)" opacity="0.06">
    <ellipse cx="440" cy="650" rx="120" ry="30"/>
  </g>

  <!-- Floating marker -->
  <text x="300" y="750" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#E8C77D" opacity="0.3" letter-spacing="4">Southeast Corridors</text>
</svg>
